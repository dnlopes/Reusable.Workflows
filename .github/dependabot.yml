version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
    groups:
      github-actions-non-major:
        update-types: [minor, patch]
      github-actions-major:
        update-types: [major]
