on:
  workflow_call:
    secrets:
      DEPENDABOT_MERGE_TOKEN:
        required: true
        description: fine-grained PAT of a code owner, with read and write access to contents and pull requests

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.user.login == 'dependabot[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.pull_request.user.login == 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]') ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Approve, merge, or rebase
        env:
          # The PAT acts as the code owner: GITHUB_TOKEN approvals never satisfy code owner review,
          # and merges pushed by GITHUB_TOKEN do not trigger the release workflow on the default branch.
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
        run: |
          set -euo pipefail

          is_code_owner() {
            local path codeowners
            for path in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
              if codeowners=$(gh api "repos/$REPO/contents/$path" -H "Accept: application/vnd.github.raw" 2>/dev/null); then
                grep -v '^[[:space:]]*#' <<<"$codeowners" | grep -qiE "(^|[[:space:]])@$1([[:space:]]|$)"
                return
              fi
            done
            return 1
          }

          approve() {
            gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" -f commit_id="$1" -f event=APPROVE -f body="$2" >/dev/null
            echo "Approved PR #$PR_NUMBER at $1"
          }

          change_patch_id() {
            gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$1" -H "Accept: application/vnd.github.diff" | git patch-id --stable | cut -d' ' -f1
          }

          rebase_if_behind() {
            local state head_sha behind
            read -r state head_sha < <(gh pr view "$1" -R "$REPO" --json state,headRefOid --jq '"\(.state) \(.headRefOid)"')
            if [[ "$state" != "OPEN" ]]; then
              return 0
            fi
            behind=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$head_sha" --jq .behind_by)
            if (( behind > 0 )); then
              gh pr comment "$1" -R "$REPO" --body "@dependabot rebase"
              echo "Asked Dependabot to rebase PR #$1"
            fi
          }

          request_merge() {
            local attempt output
            for attempt in 1 2 3 4 5; do
              if output=$(gh pr merge "$1" -R "$REPO" --auto --squash 2>&1); then
                echo "$output"
                return 0
              fi
              echo "$output" >&2
              # gh merges at once when checks already passed, so a merge of another PR in between rejects it.
              if ! grep -q "Base branch was modified" <<<"$output" || (( attempt == 5 )); then
                return 1
              fi
              sleep $(( attempt * 5 ))
            done
          }

          case "$EVENT" in
            issue_comment)
              if [[ "$(tr -d '[:space:]' <<<"$COMMENT_BODY")" != "LGTM" ]]; then
                exit 0
              fi
              if ! is_code_owner "$COMMENT_AUTHOR"; then
                echo "::notice::Ignoring LGTM from $COMMENT_AUTHOR, who is not a code owner"
                exit 0
              fi
              head_sha=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefOid --jq .headRefOid)
              pushed_at=$(gh api "repos/$REPO/commits/$head_sha" --jq .commit.committer.date)
              if [[ "$pushed_at" > "$COMMENT_CREATED_AT" ]]; then
                echo "::warning::Dependabot pushed $head_sha after the LGTM comment. Review the new changes and comment again."
                exit 0
              fi
              approve "$head_sha" "Approved by @$COMMENT_AUTHOR with an LGTM comment."
              ;;

            pull_request_review)
              if ! is_code_owner "$REVIEW_AUTHOR"; then
                exit 0
              fi
              request_merge "$PR_NUMBER"
              rebase_if_behind "$PR_NUMBER"
              ;;

            pull_request)
              head_sha=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefOid --jq .headRefOid)
              last_review=""
              while read -r author state commit_id; do
                [[ "$state" == "COMMENTED" ]] && continue
                if is_code_owner "$author"; then
                  last_review="$state $commit_id"
                fi
              done < <(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[] | "\(.user.login) \(.state) \(.commit_id)"')
              read -r state approved_sha <<<"$last_review"
              if [[ "${state:-}" != "APPROVED" && "${state:-}" != "DISMISSED" ]] || [[ "$approved_sha" == "$head_sha" ]]; then
                exit 0
              fi
              # Dependabot also pushes to an open PR when a newer version is released, so only a pure rebase keeps the approval.
              approved_change=$(change_patch_id "$approved_sha")
              current_change=$(change_patch_id "$head_sha")
              if [[ -z "$approved_change" || "$approved_change" != "$current_change" ]]; then
                echo "::notice::The changes differ from the approved commit $approved_sha. PR #$PR_NUMBER needs a new approval."
                exit 0
              fi
              approve "$head_sha" "Approved again: $head_sha is a rebase of the approved commit $approved_sha."
              ;;

            push)
              gh pr list -R "$REPO" --author app/dependabot --state open --json number,autoMergeRequest \
                --jq '.[] | select(.autoMergeRequest != null) | .number' |
                while read -r number; do
                  rebase_if_behind "$number"
                done
              ;;
          esac
